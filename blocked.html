<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pause - Site Blocked</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: white;
      color: #09090b;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      text-align: center;
      max-width: 440px;
      width: 90%;
      padding: 48px 32px;
      border: 1px solid #e4e4e7;
      border-radius: 12px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
    }

    .icon {
      font-size: 32px;
      margin-bottom: 24px;
      display: inline-block;
      padding: 16px;
      background: #f4f4f5;
      border-radius: 9999px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    p {
      color: #71717a;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-block;
      background: #18181b;
      color: white;
      padding: 12px 24px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .stats {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #f4f4f5;
      font-size: 13px;
      color: #71717a;
    }

    #daily-used, #daily-limit {
      font-weight: 600;
      color: #09090b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon" id="icon">⏰</div>
    <h1 id="title">Session Expired</h1>
    <p id="message">Your time on this site has come to an end. Take a breath and focus on what matters next.</p>

    <a href="https://www.google.com" class="btn">Return to Focus</a>

    <div class="stats" id="stats">
      Daily usage for this site: <span id="daily-used">0</span> / <span id="daily-limit">30</span> min
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const domain = params.get('domain');
    const reason = params.get('reason');

    if (reason === 'daily') {
      document.getElementById('icon').innerText = '🚫';
      document.getElementById('title').innerText = 'Daily Limit Reached';
      document.getElementById('message').innerText = `You've reached your daily limit for ${domain}. Focus on something else and come back tomorrow!`;
    } else {
      document.getElementById('title').innerText = 'Session Over';
      document.getElementById('message').innerText = `Your session for ${domain} has ended. Take a breath before deciding if you truly need more time.`;
    }

    chrome.storage.local.get(['sites', 'usage'], (data) => {
      if (domain && data.sites && data.sites[domain]) {
        const today = new Date().toISOString().split('T')[0];
        const used = (data.usage[today] && data.usage[today][domain]) || 0;
        const limit = data.sites[domain].dailyLimitMinutes;

        document.getElementById('daily-used').innerText = used;
        document.getElementById('daily-limit').innerText = limit;
      }
    });
  </script>
</body>
</html>
