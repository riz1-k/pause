<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pause Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="app-container">
    <header>
      <div class="logo">
        <img src="icons/icon48.png" alt="Logo">
        <span>Pause Settings</span>
      </div>
      <button id="set-pin" class="btn-ghost">🔒 Set PIN</button>
    </header>

    <main>
      <section class="card">
        <h2>Managed Sites</h2>
        <p class="section-desc">Websites that require intentional visits and have daily time limits.</p>

        <div id="sites-list" class="sites-list">
          <!-- Sites will be injected here -->
          <div class="empty-state">No sites configured yet.</div>
        </div>

        <div class="add-site-form">
          <input type="text" id="new-site-url" placeholder="example.com">
          <input type="number" id="new-site-limit" placeholder="30" min="1">
          <span>min/day</span>
          <button id="add-site-btn" class="btn-primary">Add Site</button>
        </div>
      </section>

      <section class="card">
        <h2>Today's Usage</h2>
        <div id="usage-list" class="usage-list">
          <!-- Usage stats will be injected here -->
        </div>
      </section>
    </main>

    <footer>
      <p>Intentional browsing helps you reclaim your focus.</p>
    </footer>
  </div>
  <script src="options.js"></script>
</body>
</html>
