<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pause</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header>
      <div class="logo">
        <img src="icons/icon48.png" alt="Logo">
        <span>Pause</span>
      </div>
      <button id="open-settings" title="Settings">⚙️</button>
    </header>

    <div id="active-session" class="session-card hidden">
      <div class="card-label">Active Session</div>
      <div class="session-domain" id="session-domain">youtube.com</div>
      <div class="timer" id="session-timer">00:00</div>
      <div class="progress-bar">
        <div id="session-progress" class="progress-fill" style="width: 0%"></div>
      </div>
    </div>

    <div id="no-session" class="empty-state">
      <div class="icon">🧘</div>
      <p>No active session</p>
    </div>

    <div class="section-title">Today's Usage</div>
    <div id="usage-summary" class="usage-summary">
      <!-- Usage injected here -->
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
